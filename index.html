<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Prompter">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Prompter</title>
<link rel="stylesheet" href="design/tokens.css">
<link rel="stylesheet" href="design/components.css">
<style>
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-ui); }
  body { min-height: 100dvh; display: grid; place-items: center; }
  .box { display: grid; gap: var(--space-4); width: min(380px, 90vw); padding: var(--space-5) 0; }
  .box .p-btn { width: 100%; }
  .mark { display: block; margin: 0 auto var(--space-3); }
  h1 { margin: 0; font: 600 24px/28px var(--font-ui); text-align: center; }
  .or { text-align: center; }
  input { box-sizing: border-box; width: 100%; min-height: var(--tap-min); text-align: center; letter-spacing: .3em; padding: 0 var(--space-4);
          font: 600 28px/32px var(--font-ui); font-variant-numeric: tabular-nums; color: var(--text); background: var(--surface-2);
          border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); }
  input::placeholder { color: var(--text-muted); letter-spacing: .3em; }
  input:focus-visible { outline: none; box-shadow: var(--focus-ring); }
</style>
</head>
<body>
<div class="box">
  <div id="markSlot"></div>
  <h1>Prompter</h1>
  <button class="p-btn" id="p">This device is the prompter (iPad)</button>
  <span class="p-cap or">or join from your phone or laptop</span>
  <input id="code" inputmode="numeric" maxlength="4" placeholder="0000" aria-label="Room code from the iPad" autocomplete="off">
  <button class="p-btn" id="r">Join as remote</button>
</div>
<script type="module">
import { markSvg } from './common.js';
document.getElementById('markSlot').innerHTML = markSvg(40);
const code = document.getElementById('code');
document.getElementById('p').onclick = () => location.href = 'prompter.html?room=' + String(Math.floor(1000 + Math.random() * 9000));
const join = () => code.value.length === 4 && (location.href = 'remote.html?room=' + code.value);
document.getElementById('r').onclick = join;
code.onkeydown = (e) => { if (e.key === 'Enter') join(); };
</script>
</body>
</html>
