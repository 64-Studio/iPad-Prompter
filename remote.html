<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompter — remote</title>
<style>
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; margin:0; padding:12px; display:grid; gap:12px; }
  textarea { width:100%; box-sizing:border-box; height:28vh; font-size:16px; background:#1c1c1c; color:#eee; border:1px solid #333; border-radius:8px; padding:8px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  button { font-size:18px; padding:12px 16px; border-radius:10px; border:0; background:#333; color:#fff; }
  #play { background:#2a6; flex:1; font-size:22px; }
  label { display:flex; gap:8px; align-items:center; flex:1; min-width:220px; }
  input[type=range] { flex:1; }
  #jog { height:160px; border-radius:12px; background:#1c1c1c; border:1px dashed #555; display:grid; place-items:center; touch-action:none; user-select:none; }
  #progress { height:24px; background:#222; border-radius:6px; position:relative; cursor:pointer; }
  #bar { position:absolute; left:0; top:0; bottom:0; background:#2a6; border-radius:6px; width:0; }
  #dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#c33; }
</style>
</head>
<body>
<div class="row"><span id="dot"></span> Room <b id="room"></b> <span id="mode"></span></div>
<textarea id="text" placeholder="Paste or type your script here (ქართული / English)"></textarea>
<div class="row">
  <button id="play">▶ Play</button>
  <button id="top">⤒ Top</button>
  <button id="mirror">Mirror: off</button>
</div>
<div class="row">
  <label>Speed <input id="speed" type="range" min="0.5" max="10" step="0.5" value="3"><span id="speedV">3</span></label>
  <label>Font <input id="font" type="range" min="24" max="160" step="2" value="64"><span id="fontV">64</span></label>
  <label>Margin <input id="margin" type="range" min="0" max="30" step="1" value="8"><span id="marginV">8</span></label>
</div>
<div id="progress"><div id="bar"></div></div>
<div id="jog">Drag up / down here to scroll manually</div>

<script type="module">
import { connect, getRoom } from './sync.js';
const $ = (id) => document.getElementById(id);
const room = getRoom();
$('room').textContent = room;

const sync = await connect(room);
$('mode').textContent = sync.mode === 'local' ? '(local test mode)' : '';
sync.onConnection((ok) => $('dot').style.background = ok ? '#2a2' : '#c33');

const s = { text: '', fontSize: 64, speed: 3, playing: false, mirror: false, margin: 8 };
const push = (patch) => { Object.assign(s, patch); sync.set('state', patch); paint(); };

function paint() {
  $('play').textContent = s.playing ? '❚❚ Pause' : '▶ Play';
  $('play').style.background = s.playing ? '#a63' : '#2a6';
  $('mirror').textContent = 'Mirror: ' + (s.mirror ? 'on' : 'off');
  $('speed').value = s.speed; $('speedV').textContent = s.speed;
  $('font').value = s.fontSize; $('fontV').textContent = s.fontSize;
  $('margin').value = s.margin; $('marginV').textContent = s.margin;
}

// Load existing room state once (so a refreshed remote doesn't wipe the script)
let loaded = false;
sync.on('state', (v) => {
  if (v) Object.assign(s, v);
  if (!loaded) { loaded = true; $('text').value = s.text || ''; }
  paint();
});
sync.on('status', (v) => { if (v) $('bar').style.width = (v.pos * 100) + '%'; });

let t;
$('text').oninput = () => { clearTimeout(t); t = setTimeout(() => push({ text: $('text').value }), 300); };
$('play').onclick = () => push({ playing: !s.playing });
$('mirror').onclick = () => push({ mirror: !s.mirror });
$('top').onclick = () => sync.set('cmd', { type: 'top', t: Date.now() });
$('speed').oninput = (e) => push({ speed: +e.target.value });
$('font').oninput = (e) => push({ fontSize: +e.target.value });
$('margin').oninput = (e) => push({ margin: +e.target.value });
$('progress').onclick = (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  sync.set('cmd', { type: 'seek', pos: (e.clientX - r.left) / r.width, t: Date.now() });
};

// Jog pad: distance from where you touched = scroll velocity. Resent every 150ms while held.
const jog = $('jog'); let y0 = null, v = 0, timer;
const sendJog = () => sync.set('jog', { v, t: Date.now() });
jog.onpointerdown = (e) => { y0 = e.clientY; jog.setPointerCapture(e.pointerId); timer = setInterval(sendJog, 150); };
jog.onpointermove = (e) => { if (y0 !== null) v = Math.round((y0 - e.clientY) * 6); };
const end = () => { y0 = null; v = 0; clearInterval(timer); sendJog(); };
jog.onpointerup = end; jog.onpointercancel = end;
</script>
</body>
</html>
